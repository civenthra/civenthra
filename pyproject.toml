[build-system]
requires = ["setuptools==84.2.1", "wheel==0.48.0"]
build-backend = "setuptools.build_meta"

[project]
name = "civenthra-local"
version = "0.2.0"
description = "Local-first, source-grounded knowledge prototype"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
authors = [{name = "Civenthra contributors"}]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/civenthra/civenthra"
Documentation = "https://github.com/civenthra/civenthra#readme"
Issues = "https://github.com/civenthra/civenthra/issues"
Source = "https://github.com/civenthra/civenthra"

[project.optional-dependencies]
test = ["pytest==9.2.0"]
voice = [
  "fastapi>=0.115,<1",
  "faster-whisper>=1.1,<2",
  "numpy>=1.26,<3",
  "soundfile>=0.12,<1",
  "uvicorn>=0.30,<1",
  "pywin32>=306; platform_system == 'Windows'",
]
voice-edge = ["edge-tts>=7,<8"]

[project.scripts]
civenthra = "civenthra.cli:main"
civenthra-ingest = "civenthra.ingest:main"
civenthra-collect = "civenthra.collect:main"
civenthra-serve = "civenthra.serve:main"

[tool.setuptools.packages.find]
include = ["civenthra*"]

[tool.setuptools.package-data]
civenthra = ["companion/*", "public_sources.json"]
