name: Feature request
description: Propose a scoped improvement that preserves offline and rights boundaries.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Describe the user need without private or restricted material.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed outcome
      description: Explain the smallest useful behavior, not only an implementation.
    validations:
      required: true
  - type: textarea
    id: boundaries
    attributes:
      label: Offline, privacy, rights, and safety impact
      description: State network use, stored data, third-party terms, and failure behavior.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: checkboxes
    id: confirmation
    attributes:
      label: Confirmation
      options:
        - label: The proposal does not require committing books, translations, private media, credentials, or model weights.
          required: true
