name: Bug report
description: Report a reproducible defect using synthetic, non-sensitive data.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Do not paste book text, private paths, conversations, logs with personal data,
        credentials, voice samples, portraits, or security exploit details. Use the
        private security reporting link for vulnerabilities.
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: "0.1.0 or full commit SHA"
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Ingestion or indexing
        - Retrieval or cited answer
        - CLI or local web interface
        - Voice, avatar, or scene adapter
        - Packaging, tests, or release audit
        - Documentation
        - Other
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal synthetic reproduction
      description: Include commands and a small fictional fixture, never private source material.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: "Windows/Linux/macOS, Python version, local-only/network-guard mode"
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation
      options:
        - label: I removed private, copyrighted, biometric, account, and credential data.
          required: true
        - label: This is not a vulnerability report.
          required: true
