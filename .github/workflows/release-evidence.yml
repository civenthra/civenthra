name: release-evidence

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Create isolated Python environment
        run: python -m venv .venv
      - name: Use isolated Python environment
        run: echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"
      - run: python -m pip install --disable-pip-version-check --require-hashes -r requirements-dev.lock
      - run: python scripts/open_source_audit.py
      - run: python scripts/validate_rights.py
      - run: python scripts/git_history_audit.py
      - run: python -m pytest -q
      - name: Build wheel, SBOM, and checksums
        run: |
          python -m pip wheel --no-deps --no-build-isolation --wheel-dir dist .
          python scripts/audit_archive.py dist/*.whl
          python scripts/build_sbom.py --output dist/civenthra.spdx.json
          python scripts/build_checksums.py --output dist/SHA256SUMS "dist/*.whl" dist/civenthra.spdx.json
      - uses: actions/attest-build-provenance@43d14bc2b83dec42d39ecae14e916627a18bb661 # v3
        with:
          subject-path: dist/*
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: civenthra-${{ github.ref_name }}
          path: dist/
          if-no-files-found: error
