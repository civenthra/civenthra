name: open-source-audit

on:
  pull_request:
  push:

permissions:
  contents: read

concurrency:
  group: audit-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.11"
          - os: ubuntu-latest
            python: "3.12"
          - os: ubuntu-latest
            python: "3.13"
          - os: windows-latest
            python: "3.12"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Create isolated Python environment
        run: python -m venv .venv
      - name: Use isolated Python environment (Unix)
        if: runner.os != 'Windows'
        run: echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"
      - name: Use isolated Python environment (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Add-Content -Path $env:GITHUB_PATH -Value "$env:GITHUB_WORKSPACE\.venv\Scripts"
      - run: python -m pip install --disable-pip-version-check --require-hashes -r requirements-dev.lock
      - run: python -m pip install --no-deps .
      - run: python -m pip check
      - run: python -m compileall -q civenthra scripts examples
      - run: python scripts/open_source_audit.py
      - run: python scripts/validate_rights.py
      - run: python scripts/git_history_audit.py
      - run: python -m pytest -q
      - run: python examples/synthetic_demo.py --lang en
      - run: python examples/synthetic_demo.py --lang zh-CN
      - name: Build package evidence
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        run: |
          python -m pip wheel --no-deps --no-build-isolation --wheel-dir dist .
          python scripts/audit_archive.py dist/*.whl
          python scripts/build_sbom.py --output dist/civenthra.spdx.json
          python scripts/build_checksums.py --output dist/SHA256SUMS "dist/*.whl" dist/civenthra.spdx.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        with:
          name: civenthra-release-evidence
          path: dist/
          if-no-files-found: error
