name: codeql

on:
  pull_request:
  push:
  schedule:
    - cron: "17 3 * * 2"

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: github/codeql-action/init@7aa4d48f0aaa9b8ac3ea6a74fb54295f540febb8 # v3
        with:
          languages: python
          queries: security-extended
      - uses: github/codeql-action/analyze@7aa4d48f0aaa9b8ac3ea6a74fb54295f540febb8 # v3
